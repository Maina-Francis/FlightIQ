<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>FlightIQ</title>
  <style>
    .from {
      stop-color: oklch(0.777 0.152 181.9);
    }
    .to {
      stop-color: oklch(0.74 0.18 34);
    }
    .plane {
      stroke: oklch(0.23 0.035 195);
    }
    @media (prefers-color-scheme: light) {
      .from {
        stop-color: oklch(0.62 0.12 178);
      }
      .to {
        stop-color: oklch(0.7 0.17 35);
      }
      .plane {
        stroke: oklch(0.985 0.012 185);
      }
    }
  </style>
  <defs>
    <linearGradient id="flightIQ-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="from" offset="0%" />
      <stop class="to" offset="100%" />
    </linearGradient>
  </defs>
  <!-- rounded-xl on the 36px navbar mark → rx 12/36 of 64 -->
  <rect width="64" height="64" rx="21.333" ry="21.333" fill="url(#flightIQ-gradient)" />
  <!-- Lucide Plane, sized like h-5 w-5 inside h-9 w-9 -->
  <g
    class="plane"
    transform="translate(14.222 14.222) scale(1.4815)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <path
      d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"
    />
  </g>
</svg>
